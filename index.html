<!DOCTYPE html>
<html lang="pt-br">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<title>Ghost Filmes</title>

	<link rel="stylesheet" href="style.css">
</head>

<body>

	<header>
		<div class="logo">GHOST <span>FILMES</span></div>

		<div class="search">
			<input
				id="busca"
				type="text"
				placeholder="🔎 Buscar filme..."
			>
		</div>
	</header>

	<main>

		<section class="hero">
			
		<section class="hero">
             <a href="LINK-OFICIAL" target="_blank">
        <button>▶ Assistir</button>
    
			<div>
				<h1>Encontre seu próximo filme</h1>
				<p>Pesquise milhares de filmes e descubra novas histórias.</p>
			</div>
		</section>

		<section>
			<h2>Filmes</h2>

			<div id="grid" class="grid"></div>
		</section>

	</main>

	<!-- MODAL -->
	<div id="modal" class="modal">

		<div class="modal-content">

			<button id="fechar" class="fechar">✕</button>

			<div id="detalhes"></div>

		</div>

	</div>

	<script src="app.js"></script>

</body>
</html>
